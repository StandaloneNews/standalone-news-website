name: Static website accessibility regression

on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - '*.css'
      - 'newsroom.js'
      - 'tests/test_accessibility_static.py'
      - '.github/workflows/accessibility-static.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  accessibility-static:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out website
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate contrast, named controls and landmarks
        run: python -m unittest discover -s tests -p test_accessibility_static.py -v
