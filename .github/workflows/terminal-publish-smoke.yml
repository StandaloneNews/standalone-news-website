name: Verify CNN, Markets, X and legal links on the live website

on:
  push:
    branches: [ops/terminal-publish-smoke]
    paths: [.github/workflows/terminal-publish-smoke.yml]

permissions: {}

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Check live Cloudflare pages and publisher feeds
        run: |
          python3 - <<'PY'
          import json, time, urllib.request
          base='https://standalonenews.com'
          def download(path):
              req=urllib.request.Request(base+path,headers={'User-Agent':'Mozilla/5.0','Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=14) as response:
                  return response.read()
          for attempt in range(24):
              try:
                  home=download('/').decode()
                  feed=json.loads(download('/api/wire'))
                  snapshot=json.loads(download('/data/news.json'))
                  cnn=[item for item in feed['items'] if item['source']=='CNN']
                  names={item['source'] for item in feed['items']}
                  archive={item['source'] for item in snapshot['items']}
                  ready=('market-chart-card' in home and 'site-legal-links' in home and 'value="StandaloneNews" selected' in home)
                  print('LIVE CHECK', json.dumps({'attempt':attempt+1,'new_ui':ready,'direct_sources':len(feed['feeds']),'available':sum(x['available'] for x in feed['feeds']),'cnn':len(cnn),'direct_examples':sorted(names&{'CNN','Bloomberg','Los Angeles Times','CNA','Benzinga'}),'archive_sources':len(archive),'archive_examples':sorted(archive&{'The Atlantic','TIME','Vox','Semafor','Variety'})}),flush=True)
                  if ready and cnn and all(x['url'].startswith('https://www.cnn.com/') and x['source_type']=='Publisher sitemap' for x in cnn) and len(archive&{'The Atlantic','TIME','Vox','Semafor','Variety'})>=3:
                      routes=['/','/edition.html','/markets.html','/sports.html','/terms.html','/privacy.html','/accessibility.html','/articles/']
                      for route in routes:
                          text=download(route).decode()
                          footer=text[text.lower().rfind('<footer'):]
                          assert all(name+'.html"' in footer for name in ('terms','privacy','newsletter-privacy','accessibility','contact')),route
                      print('Legal footer links served on', len(routes), 'live page types.')
                      break
              except Exception as exc:
                  print('Live attempt',attempt+1,str(exc),flush=True)
              time.sleep(12)
          else: raise SystemExit('Live headline update or legal footer verification did not finish.')
          PY
      - name: Check the deployed Markets panel and official public X embed
        run: |
          npm install --prefix "$RUNNER_TEMP/online-check" --no-audit --no-fund playwright-core@1.55.0
          cd "$RUNNER_TEMP/online-check"
          export CHROME_BIN="$(command -v google-chrome || command -v chromium)"
          node --input-type=commonjs - <<'JS'
          const {chromium}=require('playwright-core');
          const assert=require('node:assert/strict');
          const base='https://standalonenews.com';
          (async()=>{
            const browser=await chromium.launch({executablePath:process.env.CHROME_BIN,args:['--no-sandbox']});
            try {
              const page=await browser.newPage({viewport:{width:1400,height:900}});
              await page.goto(base,{waitUntil:'domcontentloaded'});
              await page.locator('#market-chart iframe').waitFor({timeout:25000});
              assert.equal(await page.locator('.market-chart-card').evaluate(e=>getComputedStyle(e).backgroundColor),'rgb(12, 17, 25)');
              await page.selectOption('#market-symbol','NASDAQ:QQQ');
              assert.match(await page.locator('#market-instrument').innerText(),/Nasdaq/);
              await page.locator('#market-watchlist summary').focus();
              await page.keyboard.press('Enter');
              await page.locator('#market-quotes iframe').waitFor({timeout:20000});
              assert.equal(await page.locator('#x-account').inputValue(),'StandaloneNews');
              assert.equal(await page.locator('#x-profile-link').getAttribute('href'),'https://x.com/StandaloneNews');
              await page.waitForFunction(()=>/Timeline for|unavailable here/.test(document.querySelector('#x-status').textContent),{},{timeout:30000});
              let links=0;
              let text='';
              const x=page.locator('#x-timeline iframe');
              if(await x.count()){
                const frame=x.first().contentFrame();
                text=await frame.locator('body').innerText({timeout:8000}).catch(()=>'');
                links=await frame.locator('a[href*="/status/"]').count();
              }
              console.log('X LIVE',JSON.stringify({status:await page.locator('#x-status').innerText(),links,text:text.slice(0,220)}));
              const mobile=await browser.newPage({viewport:{width:320,height:760}});
              await mobile.goto(base+'/standards',{waitUntil:'domcontentloaded'});
              assert.ok(await mobile.evaluate(()=>document.documentElement.scrollWidth<=innerWidth+1));
              await mobile.keyboard.press('Tab');
              assert.match(await mobile.evaluate(()=>document.activeElement.textContent),/skip/i);
              await mobile.keyboard.press('Enter');
              assert.equal(await mobile.evaluate(()=>document.activeElement.tagName),'MAIN');
              console.log('Verified the live chart, watchlist, X fallback, and keyboard navigation.');
            } finally { await browser.close(); }
          })().catch(e=>{console.error(e);process.exitCode=1;});
          JS
