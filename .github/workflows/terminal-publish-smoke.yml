name: Verify the public news and markets terminal

on:
  push:
    branches: [ops/terminal-publish-smoke]
    paths: [.github/workflows/terminal-publish-smoke.yml]

permissions: {}

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify the production workspace and publisher feeds
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import time
          from urllib.request import Request, urlopen

          site = "https://standalonenews.com"

          def read(path):
              request = Request(site + path, headers={
                  "User-Agent": "StandaloneNewsDeployCheck/1.0",
                  "Cache-Control": "no-cache",
              })
              with urlopen(request, timeout=12) as response:
                  return response.geturl(), response.read(2_000_000).decode()

          for attempt in range(1, 9):
              try:
                  _, home = read("/")
                  for panel in ('id="x-posts"', 'id="market-symbol"', 'id="headlines"', 'id="x-publisher-updates"'):
                      if panel not in home:
                          raise ValueError("Waiting for " + panel)
                  url, _ = read("/terminal?topic=Markets")
                  if url != site + "/?topic=Markets":
                      raise ValueError("Waiting for terminal URL compatibility")
                  _, edition = read("/edition")
                  if 'id="brief-list"' not in edition:
                      raise ValueError("Waiting for the archived edition")
                  _, api = read("/api/wire")
                  feed = json.loads(api)
                  responding = sum(source["available"] is True for source in feed["feeds"])
                  if not responding or not feed["items"] or len(feed["feeds"]) < 11:
                      raise ValueError("Waiting for expanded publisher coverage")
                  print(f"Production terminal, saved edition and URL compatibility passed. Publisher feeds responding: {responding}/{len(feed['feeds'])}; headlines: {len(feed['items'])}.")
                  break
              except (OSError, ValueError, KeyError) as exc:
                  print(f"Attempt {attempt}: {exc}", flush=True)
                  if attempt == 8:
                      raise SystemExit(1) from exc
                  time.sleep(12)
          PY
      - name: Check public X and market widgets
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/terminal-prod" --no-audit --no-fund playwright-core@1.55.0
          export CHROME_BIN="$(command -v google-chrome || command -v chromium)"
          node --input-type=module <<'JS'
          import { createRequire } from 'node:module';
          import assert from 'node:assert/strict';
          const require = createRequire(process.env.RUNNER_TEMP + '/terminal-prod/package.json');
          const { chromium } = require('playwright-core');
          const browser = await chromium.launch({executablePath: process.env.CHROME_BIN});
          try {
            const page = await browser.newPage({viewport:{width:1440,height:900}});
            await page.goto('https://standalonenews.com/', {waitUntil:'domcontentloaded'});
            await page.locator('#headlines a').first().waitFor();
            for (const [id,name] of [['market-chart','TradingView chart'],['market-quotes','TradingView quotes']]) {
              await page.locator('#'+id+' iframe').waitFor({state:'attached',timeout:22000});
              console.log(name+' mounted in production.');
            }
            await page.waitForFunction(() => /Timeline for|unavailable here/.test(document.querySelector('#x-status')?.textContent || ''), undefined, {timeout:26000});
            const status = await page.locator('#x-status').textContent();
            assert(await page.locator('#x-profile-link').isVisible());
            if (status.includes('Timeline for')) {
              const handle = await page.locator('#x-timeline iframe').elementHandle();
              const frame = await handle.contentFrame();
              const posts = await frame.locator('a[href*="/status/"]').count().catch(() => 0);
              console.log('Public X embed mounted; visible post links: '+posts+'.');
            } else {
              assert(await page.locator('#x-publisher-updates').isVisible());
              assert.match(await page.locator('#x-publisher-link').textContent(), /Federal Reserve newsroom/);
              const releases = await page.locator('#x-publisher-headlines a').count();
              assert(releases > 0);
              console.log('X timeline unavailable in Chrome; the publisher fallback showed '+releases+' Federal Reserve updates.');
            }
          } finally { await browser.close(); }
          JS
