name: Validate additional publisher RSS feeds

on:
  push:
    branches: [ops/terminal-publish-smoke]
    paths: [.github/workflows/terminal-publish-smoke.yml]

permissions: {}

jobs:
  sources:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check public XML endpoints and article dates
        shell: bash
        run: |
          python3 - <<'PY'
          import concurrent.futures
          import json
          import time
          import urllib.request
          import xml.etree.ElementTree as ET
          candidates = json.loads("[[\"The Independent\",\"World\",\"https://www.independent.co.uk/news/world/rss\"],[\"CBC News\",\"World\",\"https://www.cbc.ca/webfeed/rss/rss-topstories\"],[\"UN News\",\"World\",\"https://news.un.org/feed/subscribe/en/news/all/rss.xml\",true],[\"ProPublica\",\"US News\",\"https://www.propublica.org/feeds/propublica/main\"],[\"Axios\",\"US News\",\"https://api.axios.com/feed/\"],[\"World Health Organization\",\"World\",\"https://www.who.int/rss-feeds/news-english.xml\",true],[\"Fox News\",\"US News\",\"https://moxie.foxnews.com/google-publisher/latest.xml\"],[\"CNN\",\"US News\",\"https://rss.cnn.com/rss/cnn_topstories.rss\"],[\"Al-Monitor\",\"World\",\"https://www.al-monitor.com/rss\"],[\"The Japan Times\",\"World\",\"https://www.japantimes.co.jp/feed/\"],[\"The Straits Times\",\"World\",\"https://www.straitstimes.com/news/world/rss.xml\"],[\"The Korea Herald\",\"World\",\"https://www.koreaherald.com/rss\"],[\"Hong Kong Free Press\",\"World\",\"https://hongkongfp.com/feed/\"],[\"The Times of Israel\",\"World\",\"https://www.timesofisrael.com/feed/\"],[\"The Kyiv Independent\",\"World\",\"https://kyivindependent.com/rss/\"],[\"The Conversation\",\"Science\",\"https://theconversation.com/us/articles.atom\"],[\"STAT\",\"Science\",\"https://www.statnews.com/feed/\"],[\"ScienceDaily\",\"Science\",\"https://www.sciencedaily.com/rss/top/science.xml\"],[\"CISA\",\"Technology\",\"https://www.cisa.gov/cybersecurity-advisories/all.xml\",true],[\"US Census Bureau\",\"Economy\",\"https://www.census.gov/newsroom/press-releases/rss.xml\",true],[\"US Treasury\",\"Government\",\"https://home.treasury.gov/news/press-releases/rss\",true],[\"USGS\",\"Science\",\"https://www.usgs.gov/news/all/all/feed\",true],[\"Bank of Canada\",\"Economy\",\"https://www.bankofcanada.ca/content_type/press-releases/feed/\",true],[\"Statistics Canada\",\"Economy\",\"https://www150.statcan.gc.ca/n1/dai-quo/rss/rss-eng.xml\",true],[\"Australian Bureau of Statistics\",\"Economy\",\"https://www.abs.gov.au/rss/rss.xml\",true],[\"ESPN\",\"Sports\",\"https://www.espn.com/espn/rss/news\"],[\"BBC Sport\",\"Sports\",\"https://feeds.bbci.co.uk/sport/rss.xml\"],[\"The Guardian Sport\",\"Sports\",\"https://www.theguardian.com/sport/rss\"],[\"NHL\",\"Sports\",\"https://www.nhl.com/rss/news.xml\"],[\"CoinDesk\",\"Markets\",\"https://www.coindesk.com/arc/outboundfeeds/rss/\"],[\"Cointelegraph\",\"Markets\",\"https://cointelegraph.com/rss\"],[\"Investing.com\",\"Markets\",\"https://www.investing.com/rss/news.rss\"]]")

          def local(tag):
              return (tag.rsplit("}",1)[-1]).lower()

          def check(feed):
              name, topic, url, *_ = feed
              started = time.monotonic()
              try:
                  req = urllib.request.Request(url, headers={"User-Agent":"StandaloneNewsRSS/1.0 (+https://standalonenews.com/)", "Accept":"application/rss+xml, application/atom+xml, text/xml, application/xml"})
                  with urllib.request.urlopen(req, timeout=9) as response:
                      body = response.read(1500000)
                      final = response.geturl()
                  root = ET.fromstring(body)
                  if local(root.tag) not in {'rss','rdf','feed'}:
                      raise ValueError("Non-feed document")
                  entries = [row for row in root.iter() if local(row.tag) in {'item','entry'}]
                  dated = sum(any(local(child.tag) in {'pubdate','date','published','updated'} and child.text for child in row) for row in entries)
                  return ('FEED',name, final, local(root.tag), len(entries), dated, round(time.monotonic()-started,2), len(body))
              except Exception as exc:
                  return ('ERROR',name,str(exc),round(time.monotonic()-started,2))

          with concurrent.futures.ThreadPoolExecutor(max_workers=10) as pool:
              for result in pool.map(check,candidates):
                  print(json.dumps(result,ensure_ascii=True),flush=True)
          PY
