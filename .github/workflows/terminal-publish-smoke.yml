name: Verify Reuters, AP and expanded news feeds before publishing

on:
  push:
    branches: [ops/terminal-publish-smoke]
    paths: [.github/workflows/terminal-publish-smoke.yml]

permissions:
  contents: read

jobs:
  feeds:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d0f09230607501c12a79b34b385011d3eeef73e5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test source attribution, dates and cached coverage
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py'
          cat > "$RUNNER_TEMP/discovery.xml" <<'XML'
          <rss><channel>
          <item><title>Newest actual Reuters headline - Reuters</title><link>https://news.google.com/rss/articles/item-one?oc=5</link><pubDate>Tue, 17 Nov 2026 01:00:00 GMT</pubDate><source url="https://www.reuters.com">Reuters</source></item>
          <item><title>Different publisher</title><link>https://news.google.com/rss/articles/item-two</link><pubDate>Tue, 17 Nov 2026 01:03:00 GMT</pubDate><source url="https://example.org">Other</source></item>
          <item><title>Wrong redirect</title><link>https://example.org/pretend</link><pubDate>Tue, 17 Nov 2026 01:05:00 GMT</pubDate><source url="https://www.reuters.com">Reuters</source></item>
          <item><title>Reuters without date</title><link>https://news.google.com/rss/articles/item-three</link><source url="https://www.reuters.com">Reuters</source></item>
          <item><title>Old Reuters story</title><link>https://news.google.com/rss/articles/item-four</link><pubDate>Mon, 09 Nov 2026 00:00:00 GMT</pubDate><source url="https://www.reuters.com">Reuters</source></item>
          <item><title>Earlier Reuters headline - Reuters</title><link>https://news.google.com/rss/articles/item-five</link><pubDate>Tue, 17 Nov 2026 00:00:00 GMT</pubDate><source url="https://reuters.com">Reuters</source></item>
          </channel></rss>
          XML
          python3 - <<'PY'
          from datetime import datetime
          from pathlib import Path
          import json, os, sys
          sys.path.insert(0,'scripts')
          import update_news
          source=next(x for x in update_news.SOURCES if x['id']=='terminal_reuters')
          now=datetime.fromisoformat('2026-11-17T02:00:00+00:00')
          path=Path(os.environ['RUNNER_TEMP'])
          items=update_news.parse_rss((path/'discovery.xml').read_bytes(),source,now)
          assert [x['title'] for x in items]==['Newest actual Reuters headline','Earlier Reuters headline']
          assert all(x['source']=='Reuters' and x['source_type']=='Google News discovery' and x['summary']=='' for x in items)
          update_news.TARGET=path/'discovery-cache.json'
          update_news.TARGET.write_text(json.dumps({'items':items+[dict(items[0],published_at='2026-11-10T00:00:00Z')]}))
          assert update_news.recent_discovery_items(now,{'Reuters'})==items
          assert update_news.recent_discovery_items(now,{'Associated Press'})==[]
          print('Verified publisher identity, dates, new-tab URLs and up to 72-hour cache recovery.')
          PY
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import sourceList from './data/terminal-sources.json' with { type:'json' };
          import {parseFeed} from './functions/api/wire.js';
          import {itemFrom} from './wire-feed.js';
          const source=sourceList.find(x=>x.id==='reuters');
          const xml=fs.readFileSync(process.env.RUNNER_TEMP+'/discovery.xml','utf8');
          const now=Date.parse('2026-11-17T02:00:00Z');
          const items=parseFeed(xml,source,now);
          assert.deepEqual(items.map(x=>x.title),['Newest actual Reuters headline','Earlier Reuters headline']);
          assert.ok(items.every(x=>x.source==='Reuters'&&x.source_type==='Google News discovery'));
          assert.ok(itemFrom(items[0],now).viaGoogleNews);
          assert.equal(itemFrom(items[0],now).official,false);
          assert.ok(sourceList.filter(x=>x.direct).length+11<=40);
          console.log('Verified Worker publication and Google News label.');
          JS
      - name: Build a headline snapshot using public feeds
        run: |
          python3 scripts/update_news.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          rows=json.loads(Path('data/news.json').read_text())['items']
          added={'Reuters','Associated Press','POLITICO','USA TODAY',"Barron's",'Yahoo Finance','The Independent','The Globe and Mail','The Economist'}
          counts={name:sum(x['source']==name for x in rows) for name in sorted(added)}
          print('NEW SOURCES', json.dumps(counts))
          assert sum(x>0 for x in counts.values())>=5,counts
          PY
