name: Verify the dark animated market bar on the live site

on:
  push:
    branches: [ops/terminal-publish-smoke]
    paths: [.github/workflows/terminal-publish-smoke.yml]

permissions: {}

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Wait for the dark ticker deployment
        run: |
          python3 - <<'PY'
          import time
          import urllib.request
          for attempt in range(18):
              try:
                  request = urllib.request.Request('https://standalonenews.com/',headers={'User-Agent':'Mozilla/5.0','Cache-Control':'no-cache'})
                  page = urllib.request.urlopen(request,timeout=12).read().decode()
                  if '<tv-ticker-tape' in page and 'href="./terminal.css?v=10"' in page:
                      print('Live page is serving the new ticker.',flush=True)
                      break
                  print('Waiting for Cloudflare',attempt+1,flush=True)
              except Exception as error:
                  print(error,flush=True)
              time.sleep(10)
          else:
              raise SystemExit('Ticker deployment was not visible within the verification window.')
          PY
      - name: Verify live quote data, dark colors, animation and pause behavior
        run: |
          npm install --prefix "$RUNNER_TEMP/market-render" --no-audit --no-fund playwright-core@1.55.0 pngjs@7.0.0 axe-core@4.10.3
          cd "$RUNNER_TEMP/market-render"
          export CHROME_BIN="$(command -v google-chrome || command -v chromium)"
          export MARKET_BAR_BASE="https://standalonenews.com/"
          node --input-type=commonjs - <<'JS'
          const {chromium}=require('playwright-core');
          const {PNG}=require('pngjs');
          const assert=require('node:assert/strict');

          function compare(a,b) {
            const x=PNG.sync.read(a), y=PNG.sync.read(b);
            assert.equal(x.width,y.width);
            assert.equal(x.height,y.height);
            let changed=0, dark=0, bright=0;
            for(let i=0;i<x.data.length;i+=4) {
              const [r,g,b]=x.data.subarray(i,i+3);
              if(r<54&&g<63&&b<80) dark++;
              if(r>224&&g>224&&b>224) bright++;
              if(Math.abs(r-y.data[i])+Math.abs(g-y.data[i+1])+Math.abs(b-y.data[i+2])>45) changed++;
            }
            const size=x.width*x.height;
            return {changed:changed/size,dark:dark/size,bright:bright/size};
          }

          async function quotes(page) {
            const cdp=await page.context().newCDPSession(page);
            try {
              const {root}=await cdp.send('DOM.getDocument');
              const {nodeId}=await cdp.send('DOM.querySelector',{nodeId:root.nodeId,selector:'#market-top-quotes'});
              const {node}=await cdp.send('DOM.describeNode',{nodeId,depth:-1,pierce:true});
              const gather=n=>[n.nodeType===3?n.nodeValue:'',...(n.shadowRoots??[]).flatMap(gather),...(n.children??[]).flatMap(gather)];
              return gather(node).filter(s=>s.trim()).join(' ');
            } finally {await cdp.detach();}
          }

          (async()=>{
            const browser=await chromium.launch({executablePath:process.env.CHROME_BIN,args:['--no-sandbox']});
            try {
              for(const {width,reducedMotion,colorScheme} of [
                {width:1440,reducedMotion:'no-preference',colorScheme:'light'},
                {width:390,reducedMotion:'no-preference',colorScheme:'dark'},
                {width:320,reducedMotion:'reduce',colorScheme:'light'},
              ]){
                const page=await browser.newPage({viewport:{width,height:850},reducedMotion,colorScheme,hasTouch:width<500});
                await page.goto(process.env.MARKET_BAR_BASE,{waitUntil:'domcontentloaded'});
                const button=page.locator('#market-motion');
                await button.waitFor({timeout:25000});
                const strip=page.locator('#market-top-scroll');
                let rendered='';
                for(let i=0;i<25;i++){
                  rendered=await quotes(page);
                  if(/\bSPY\b/.test(rendered)&&/\d+\.\d+/.test(rendered)) break;
                  await page.waitForTimeout(400);
                }
                assert.match(rendered,/\bSPY\b/);
                assert.match(rendered,/\d+\.\d+/);
                const first=await strip.screenshot();
                await page.waitForTimeout(850);
                const second=await strip.screenshot();
                const running=compare(first,second);
                assert.ok(running.dark>.82,JSON.stringify(running));
                assert.ok(running.bright<.1,JSON.stringify(running));
                if(reducedMotion==='reduce'){
                  assert.equal(await button.innerText(),'Play ticker');
                  assert.ok(running.changed < .012,JSON.stringify(running));
                }else{
                  assert.equal(await button.innerText(),'Pause ticker');
                  assert.ok(running.changed > .014,JSON.stringify(running));
                  await button.focus();
                  await page.keyboard.press('Enter');
                  assert.equal(await button.innerText(),'Play ticker');
                }
                assert.equal(await page.locator('#market-top-quotes').getAttribute('theme'),'dark');
                assert.equal(await strip.getAttribute('data-playing'),null);
                const paused=await strip.screenshot();
                await page.waitForTimeout(800);
                const still=compare(paused,await strip.screenshot());
                assert.ok(still.changed<.012,JSON.stringify(still));
                assert.ok(await page.evaluate(()=>document.documentElement.scrollWidth<=innerWidth+1));
                if(width < 500){
                  await strip.focus();
                  await page.keyboard.press('ArrowRight');
                  await page.waitForFunction(()=>document.querySelector('#market-top-scroll').scrollLeft>0);
                }
                await button.focus();
                await page.keyboard.press('Enter');
                assert.equal(await button.innerText(),'Pause ticker');
                const resumed=await strip.screenshot();
                await page.waitForTimeout(800);
                const after=compare(resumed,await strip.screenshot());
                assert.ok(after.changed>.014, JSON.stringify(after));
                await page.addScriptTag({path:require.resolve('axe-core')});
                const violations=await page.evaluate(async()=>(
                  await axe.run('.market-top',{iframes:false,runOnly:{type:'tag',values:['wcag2a','wcag2aa','wcag21a','wcag21aa','wcag22aa']}})
                ).violations.map(x=>x.id));
                assert.deepEqual(violations,[]);
                console.log('TICKER VERIFIED',JSON.stringify({width,reducedMotion,colorScheme,running,still,after}));
                await page.close();
              }
            }finally{await browser.close();}
          })().catch(e=>{console.error(e);process.exitCode=1;});
          JS
