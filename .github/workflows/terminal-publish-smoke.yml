name: Audit Standalone News public pages for accessibility

on:
  push:
    branches: [ops/terminal-publish-smoke]
    paths: [.github/workflows/terminal-publish-smoke.yml]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 39cfd6d2443d703bfadcffaae9698add6b70fcd5
      - name: Scan every public page for WCAG violations and responsive overflow
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/standalone-audit.log 2>&1 &
          export SITE_ROOT="$PWD"
          npm install --prefix "$RUNNER_TEMP/a11y" --no-audit --no-fund axe-core@4.10.3 playwright-core@1.55.0
          cd "$RUNNER_TEMP/a11y"
          export CHROME_BIN="$(command -v google-chrome || command -v chromium)"
          node --input-type=commonjs - <<'JS'
          const {chromium}=require('playwright-core');
          const fs=require('node:fs');
          const path=require('node:path');
          const assert=require('node:assert/strict');
          const base='http://127.0.0.1:8080';
          const root=process.env.SITE_ROOT;
          const pages=['/',...fs.readdirSync(root).filter(x=>x.endsWith('.html')&&!['index.html','shadow-test.html','terminal.html'].includes(x)).map(x=>'/'+x),'/articles/',...fs.readdirSync(path.join(root,'articles')).filter(x=>x.endsWith('.html')&&x!=='index.html').map(x=>'/articles/'+x)];
          const groups=new Map();
          function add(route,name,val) {
            if (!groups.has(name)) groups.set(name,[]);
            groups.get(name).push([route,val]);
          }
          (async()=>{
            const browser=await chromium.launch({executablePath:process.env.CHROME_BIN,args:['--no-sandbox']});
            try {
              const context=await browser.newContext({viewport:{width:1280,height:900},reducedMotion:'reduce'});
              await context.route('**/*',r=>r.request().url().startsWith(base+'/')?r.continue():r.abort());
              let next=0;
              await Promise.all(Array.from({length:4},async()=>{
                const page=await context.newPage();
                while(next<pages.length){
                  const route=pages[next++];
                  try{
                    const response=await page.goto(base+route,{waitUntil:'load',timeout:18000});
                    assert.ok(response.ok());
                    await page.addScriptTag({path:require.resolve('axe-core')});
                    const data=await page.evaluate(async()=>{
                      const rules=await axe.run({runOnly:{type:'tag',values:['wcag2a','wcag2aa','wcag21a','wcag21aa','wcag22aa']},iframes:false});
                      return {issues:rules.violations.map(v=>({id:v.id,items:v.nodes.map(n=>[n.target.join('/'),n.failureSummary?.slice(0,300)])})),
                          title:document.title,heading:!!document.querySelector('h1'),skip:!!document.querySelector('a.skip-link'),
                          footer:!!document.querySelector('footer a[href$="terms.html"]'),main:!!document.querySelector('main,[role=main]')};
                    });
                    for(const {id,items} of data.issues) add(route,id,items);
                    for(const key of ['title','heading','skip','footer','main']) if(!data[key]) add(route,'missing '+key,[]);
                    if(!route.startsWith('/articles/')||route==='/articles/'||route===pages.at(-1)){
                      await page.setViewportSize({width:320,height:760});
                      const overflow=await page.evaluate(()=>({excess:document.documentElement.scrollWidth-innerWidth, elements:[...document.querySelectorAll('body *')].filter(e=>e.getBoundingClientRect().right>innerWidth+3&&e.clientWidth>25).slice(0,8).map(e=>[e.tagName,e.id,e.className?.baseVal||e.className])}));
                      if (overflow.excess>2) add(route,'mobile overflow',overflow);
                      await page.setViewportSize({width:1280,height:900});
                    }
                  }catch(e){add(route,'scan failed',String(e).slice(0,350));}
                }
                await page.close();
              }));
              console.log('AUDITED',pages.length);
              for(const [rule,affected] of groups) {
                const ordinary=affected.filter(([route])=>!route.startsWith('/articles/')||route==='/articles/');
                const articles=affected.filter(([route])=>route.startsWith('/articles/')&&route!=='/articles/');
                const rows=[...ordinary,...articles.slice(0,2)].map(([route,detail])=>[route,Array.isArray(detail)?detail.slice(0,9):detail]);
                console.log('AUDIT',JSON.stringify({rule,count:affected.length,rows}));
              }
            } finally { await browser.close(); }
          })().catch(e=>{console.error(e);process.exitCode=1;});
          JS
