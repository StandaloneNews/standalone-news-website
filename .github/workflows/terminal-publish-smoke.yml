name: Verify homepage navigation and headline link styles

on:
  push:
    branches: [ops/terminal-publish-smoke]
    paths: [.github/workflows/terminal-publish-smoke.yml]

permissions: {}

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check production links and browser layout
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/sections-test" --no-audit --no-fund axe-core@4.10.3 playwright-core@1.55.0
          export CHROME_BIN="$(command -v google-chrome || command -v chromium)"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { createRequire } from 'node:module';
          import { setTimeout as delay } from 'node:timers/promises';

          const require = createRequire(process.env.RUNNER_TEMP + '/sections-test/package.json');
          const { chromium } = require('playwright-core');
          const axe = require.resolve('axe-core/axe.min.js');
          const site = 'https://standalonenews.com';
          const expected = [
            ['News edition','./edition.html'],
            ['Daily brief','./edition.html#brief'],
            ['Market desk','./markets.html'],
            ['Company research','./research.html'],
            ['Explainers','./articles/'],
            ['Sports','./sports.html'],
            ['Community','./discuss.html'],
            ['Accessibility','./accessibility.html'],
          ];
          let updated = false;
          for (let attempt = 0; attempt < 8 && !updated; attempt++) {
            try {
              const response = await fetch(site+'/', {cache:'no-cache',signal:AbortSignal.timeout(9000)});
              const html = await response.text();
              updated = response.ok && html.includes('class="site-sections"') && html.includes('terminal.css?v=7');
            } catch {}
            if (!updated) await delay(10000);
          }
          assert(updated,'The new homepage header did not reach production');

          for (const [label, path] of expected) {
            const response = await fetch(new URL(path,site+'/'),{signal:AbortSignal.timeout(12000)});
            assert(response.ok, label+' returned '+response.status);
            if (label === 'Daily brief') assert((await response.text()).includes('id="brief"'));
          }

          const browser = await chromium.launch({executablePath:process.env.CHROME_BIN});
          try {
            for (const width of [1440, 390, 320]) {
              const page = await browser.newPage({viewport:{width,height:900}});
              await page.route('https://**/*', route => new URL(route.request().url()).hostname === 'standalonenews.com' ? route.continue() : route.abort());
              await page.goto(site+'/',{waitUntil:'domcontentloaded'});
              const nav = page.getByRole('navigation',{name:'Site sections'});
              assert.equal(await nav.getByRole('link').count(),8);
              for (const [label,path] of expected) {
                const link = nav.getByRole('link',{name:label,exact:true});
                assert(await link.isVisible());
                assert.equal(await link.getAttribute('href'),path);
                const rect=await link.boundingBox();
                assert(rect.height>=44 && rect.x>=0 && rect.x+rect.width<=width+1,label+' misplaced at '+width);
              }
              await nav.getByRole('link',{name:'News edition'}).focus();
              await page.keyboard.press('Tab');
              assert.equal(await page.evaluate(() => document.activeElement.textContent.trim()),'Daily brief');
              assert.equal(await page.evaluate(() => getComputedStyle(document.activeElement).outlineWidth),'3px');
              const headline = page.locator('#headlines .row-title').first();
              await headline.waitFor();
              assert.equal(await headline.evaluate(link => getComputedStyle(link).textDecorationLine),'none');
              await headline.focus();
              assert.equal(await headline.evaluate(link => getComputedStyle(link).outlineWidth),'3px');
              assert.equal(await headline.evaluate(link => getComputedStyle(link).color),'rgb(255, 197, 0)');
              if (width === 1440) {
                await nav.getByRole('link',{name:'News edition'}).focus();
                await headline.hover();
                assert.equal(await headline.evaluate(link => getComputedStyle(link).color),'rgb(255, 197, 0)');
              }
              await page.addScriptTag({path:axe});
              const failures = await page.evaluate(async () => (await axe.run('.site-sections',{runOnly:['wcag2a','wcag2aa','wcag21a','wcag21aa','wcag22aa']})).violations.map(v=>v.id));
              assert.deepEqual(failures,[]);
              console.log(width+'px: all eight links visible; headline styling, keyboard focus and automated accessibility checks passed.');
              await page.close();
            }
          } finally { await browser.close(); }
          console.log('All eight destinations loaded, including the Daily brief anchor.');
          JS
