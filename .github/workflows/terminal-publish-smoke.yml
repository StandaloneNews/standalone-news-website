name: Verify the redesigned Standalone News production site

on:
  push:
    branches: [ops/terminal-publish-smoke]
    paths: [.github/workflows/terminal-publish-smoke.yml]

permissions: {}

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify the edition and the live terminal endpoint
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import time
          from urllib.request import Request, urlopen

          site = "https://standalonenews.com"

          def read(path):
              request = Request(site + path, headers={
                  "User-Agent": "StandaloneNewsDeployCheck/1.0",
                  "Cache-Control": "no-cache",
              })
              with urlopen(request, timeout=12) as response:
                  return response.read(2_000_000).decode()

          for attempt in range(1, 9):
              try:
                  home = read("/")
                  if not (0 < home.find('id="news-terminal"') < home.find('id="lead-story"') < home.find('id="brief"') < home.find('id="newsletter"')):
                      raise ValueError("Waiting for the new homepage order")
                  if '<summary>Show today’s five-story brief</summary>' not in home:
                      raise ValueError("Waiting for the brief disclosure")
                  terminal = read("/terminal")
                  if "terminal.js?v=3" not in terminal or 'id="clear-filters"' not in terminal:
                      raise ValueError("Waiting for the redesigned terminal")
                  if "--edition-accent: #ffc500" not in read("/broadsheet.css?v=edition-2"):
                      raise ValueError("Waiting for the shared edition stylesheet")
                  feed = json.loads(read("/api/wire"))
                  responding = sum(source["available"] is True for source in feed["feeds"])
                  if not responding or not feed["items"]:
                      raise ValueError("The terminal endpoint has no current headlines")
                  routes = ["/markets.html", "/research.html", "/sports.html", "/discuss.html", "/personalize.html", "/articles/", "/about.html", "/accessibility.html", "/standards.html", "/contact.html", "/privacy.html", "/terms.html", "/newsletter-privacy.html", "/newsletter-status.html"]
                  for route in routes:
                      if "broadsheet.css?v=edition-2" not in read(route):
                          raise ValueError("Waiting for redesigned route " + route)
                  print(f"Homepage, terminal and {len(routes)} other routes checked. Feed: {responding} of {len(feed['feeds'])} sources, {len(feed['items'])} headlines.")
                  break
              except (OSError, ValueError, KeyError) as exc:
                  print(f"Attempt {attempt}: {exc}", flush=True)
                  if attempt == 8:
                      raise SystemExit(1) from exc
                  time.sleep(12)
          PY
