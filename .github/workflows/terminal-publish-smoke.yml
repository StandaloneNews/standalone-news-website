name: Inspect the market bar theme and quote widgets

on:
  push:
    branches: [ops/terminal-publish-smoke]
    paths: [.github/workflows/terminal-publish-smoke.yml]

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect the live bar and TradingView widget rendering
        run: |
          npm install --prefix "$RUNNER_TEMP/ticker-probe" --no-audit --no-fund playwright-core@1.55.0
          cd "$RUNNER_TEMP/ticker-probe"
          export CHROME_BIN="$(command -v google-chrome || command -v chromium)"
          node --input-type=commonjs - <<'JS'
          const {chromium}=require('playwright-core');
          const base='https://standalonenews.com';
          (async()=>{
            const browser=await chromium.launch({executablePath:process.env.CHROME_BIN,args:['--no-sandbox']});
            try {
              const live=await browser.newPage({viewport:{width:1440,height:850}});
              await live.goto(base,{waitUntil:'domcontentloaded'});
              const prior=live.locator('#market-top-quotes iframe');
              await prior.waitFor({timeout:16000});
              const doc=prior.contentFrame();
              await doc.getByText('SPY',{exact:true}).first().waitFor({timeout:14000});
              const old=await doc.locator('body').evaluate(el=>({
                body:getComputedStyle(el).backgroundColor,
                root:getComputedStyle(document.documentElement).backgroundColor,
                scheme:getComputedStyle(document.documentElement).colorScheme,
                theme:document.documentElement.className,
                surface:[...el.querySelectorAll('*')].map(e=>getComputedStyle(e).backgroundColor).filter(x=>x!=='rgba(0, 0, 0, 0)').slice(0,10),
              }));
              console.log('OLD BAR',JSON.stringify(old));
              const options={symbols:[{proName:'AMEX:SPY',title:'SPY'},{proName:'NASDAQ:QQQ',title:'QQQ'},{proName:'NASDAQ:NVDA',title:'NVDA'},{proName:'AMEX:GLD',title:'GLD'},{proName:'COINBASE:BTCUSD',title:'Bitcoin'}],colorTheme:'dark',isTransparent:true,displayMode:'regular',showSymbolLogo:false,locale:'en'};
              for (const kind of ['ticker-tape','tickers','ticker-tag']) {
                const page=await browser.newPage({viewport:{width:1360,height:850}});
                const legacy='<div class="tradingview-widget-container"><div class="tradingview-widget-container__widget"></div><script src="https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js" async>'+JSON.stringify(options)+'</script></div>';
                const tag='tv-'+kind;
                const wc='<script type=module src="https://widgets.tradingview-widget.com/w/en/'+tag+'.js"></script><'+tag+' theme="dark" transparent hide-chart symbol="AMEX:SPY" symbols="AMEX:SPY,NASDAQ:QQQ,NASDAQ:NVDA,AMEX:GLD,COINBASE:BTCUSD"></'+tag+'>';
                const html='<!doctype html><html style="color-scheme:dark;background:#121a25;color:#edf3fa;--tv-widget-background-color:transparent;--tv-widget-text-color:#edf3fa;--tv-widget-font-family:monospace"><body>'+wc+(kind==='ticker-tape'?legacy:'')+'</body></html>';
                await page.route(base+'/__ticker_probe',r=>r.fulfill({contentType:'text/html',body:html}));
                await page.goto(base+'/__ticker_probe',{waitUntil:'load'});
                await page.waitForFunction(tag=>!!customElements.get(tag),tag,{timeout:7000}).catch(()=>{});
                const result=await page.locator(tag).evaluate(el=>({defined:!!customElements.get(el.localName), observed:customElements.get(el.localName)?.observedAttributes??[], bounds:el.getBoundingClientRect().toJSON()}));
                console.log('WIDGET',JSON.stringify({kind,...result}));
                if (result.defined) {
                  const aria=await page.locator(tag).ariaSnapshot({timeout:6000}).catch(()=> '');
                  console.log('WIDGET ARIA',kind,JSON.stringify(aria.slice(0,475)));
                }
                if(kind==='ticker-tape'){
                  const iframe=page.locator('iframe').first();
                  await iframe.waitFor({timeout:10000});
                  const frame=iframe.contentFrame();
                  await frame.getByText('SPY',{exact:true}).first().waitFor({timeout:14000});
                  const metrics=await frame.locator('body').evaluate(el=>({
                    body:getComputedStyle(el).backgroundColor,
                    root:getComputedStyle(document.documentElement).backgroundColor,
                    theme:document.documentElement.className,
                    surface:[...el.querySelectorAll('*')].map(e=>getComputedStyle(e).backgroundColor).filter(x=>x!=='rgba(0, 0, 0, 0)').slice(0,10),
                    animations:document.getAnimations().map(a=>a.animationName),
                  }));
                  console.log('TAPE LEGACY',JSON.stringify(metrics));
                }
                await page.close();
              }
            } finally { await browser.close(); }
          })().catch(e=>{console.error(e);process.exitCode=1;});
          JS
