name: Verify terminal branding in production

on:
  push:
    branches: [ops/terminal-publish-smoke]
    paths: [.github/workflows/terminal-publish-smoke.yml]

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Wait for the branded terminal and verify its assets
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import time
          from urllib.request import Request, urlopen

          site = "https://standalonenews.com"

          def read(path):
              request = Request(site + path, headers={
                  "User-Agent": "StandaloneNewsDeployCheck/1.0",
                  "Cache-Control": "no-cache",
              })
              with urlopen(request, timeout=10) as response:
                  return response.headers, response.read(2_000_000)

          for attempt in range(1, 9):
              try:
                  _, page = read("/terminal")
                  if b"terminal.css?v=2" not in page or b"assets/sn-brand-logo.png" not in page:
                      raise ValueError("Waiting for the branded terminal HTML")
                  _, stylesheet = read("/terminal.css?v=2")
                  if b"#fdfcf3" not in stylesheet or b"#ffc500" not in stylesheet:
                      raise ValueError("Waiting for the cream and yellow stylesheet")
                  _, logo = read("/assets/sn-brand-logo.png")
                  if not logo.startswith(b"\x89PNG\r\n\x1a\n"):
                      raise ValueError("The masthead logo did not return a PNG")
                  _, feed = read("/api/wire")
                  payload = json.loads(feed)
                  responding = sum(source["available"] is True for source in payload["feeds"])
                  if not responding:
                      raise ValueError("No direct feed sources responding")
                  print(f"Production terminal, stylesheet and logo verified. Feed: {responding} of {len(payload['feeds'])} sources, {len(payload['items'])} entries.")
                  break
              except (OSError, ValueError, KeyError) as exc:
                  print(f"Attempt {attempt}: {exc}", flush=True)
                  if attempt == 8:
                      raise SystemExit(1) from exc
                  time.sleep(12)
          PY
      - name: Check the rendered terminal at desktop and mobile widths
        shell: bash
        run: |
          chrome="$(command -v google-chrome || command -v chromium)"
          "$chrome" --headless --disable-dev-shm-usage --no-sandbox \
            --user-data-dir="$(mktemp -d)" --remote-debugging-port=9222 about:blank \
            >"$RUNNER_TEMP/terminal-chrome.log" 2>&1 &
          chrome_pid=$!
          trap 'kill "$chrome_pid" 2>/dev/null || true' EXIT
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { setTimeout as delay } from 'node:timers/promises';
          const endpoint = 'http://127.0.0.1:9222/json/list';
          let targets;
          for (let attempt = 0; attempt < 30 && !targets; attempt++) {
            try { targets = await (await fetch(endpoint)).json(); }
            catch { await delay(300); }
          }
          assert(targets, 'Chrome DevTools did not start');
          const socket = new WebSocket(targets.find(target => target.type === 'page').webSocketDebuggerUrl);
          await new Promise((resolve, reject) => {
            socket.addEventListener('open', resolve, { once: true });
            socket.addEventListener('error', reject, { once: true });
          });
          const pending = new Map();
          let nextId = 0;
          socket.onmessage = ({ data }) => {
            const message = JSON.parse(data);
            const callback = pending.get(message.id);
            if (!callback) return;
            pending.delete(message.id);
            clearTimeout(callback.timeout);
            if (message.error) callback.reject(Error(message.error.message));
            else callback.resolve(message.result);
          };
          function call(method, params = {}) {
            return new Promise((resolve, reject) => {
              const id = ++nextId;
              const timeout = setTimeout(() => reject(Error(method + ' timed out')), 10000);
              pending.set(id, { resolve, reject, timeout });
              socket.send(JSON.stringify({ id, method, params }));
            });
          }
          try {
            for (const width of [1440, 390, 320]) {
              await call('Emulation.setDeviceMetricsOverride', {
                width, height: 900, deviceScaleFactor: 1, mobile: width < 600,
              });
              await call('Page.navigate', { url: 'https://standalonenews.com/terminal' });
              let shown;
              for (let attempt = 0; attempt < 60 && !shown; attempt++) {
                await delay(250);
                const { result } = await call('Runtime.evaluate', {
                  expression: 'Boolean(document.querySelector(".brand img")?.naturalWidth && document.querySelector("#headlines a"))',
                  returnByValue: true,
                });
                shown = result.value;
              }
              assert(shown, 'Logo and headlines must render at ' + width);
              const { result } = await call('Runtime.evaluate', {
                expression: '({ paper: getComputedStyle(document.body).backgroundColor, accent: getComputedStyle(document.querySelector(".top")).borderTopColor, viewport: innerWidth, width: document.documentElement.clientWidth, scrollWidth: document.documentElement.scrollWidth, brand: document.querySelector(".brand img").getBoundingClientRect().width, links: document.querySelectorAll("#headlines a").length })',
                returnByValue: true,
              });
              assert.equal(result.value.paper, 'rgb(253, 252, 243)');
              assert.equal(result.value.accent, 'rgb(255, 197, 0)');
              assert.equal(result.value.viewport, width);
              assert(result.value.scrollWidth <= result.value.width, 'Horizontal overflow at ' + width);
              assert.equal(result.value.brand, 46);
              console.log(width + 'px: logo loaded, theme applied and ' + result.value.links + ' headline links rendered without horizontal overflow.');
            }
          } finally {
            socket.close();
          }
          JS
