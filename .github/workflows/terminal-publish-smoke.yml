name: Apply and verify legal links and accessibility for Standalone News

on:
  push:
    branches: [ops/terminal-publish-smoke]
    paths: [.github/workflows/terminal-publish-smoke.yml]

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: updates/terminal-legal-accessibility
      - name: Apply the shared footer and keyboard navigation to published pages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, 'scripts')
          from site_chrome import with_site_chrome
          root = Path('.')
          pages = [p for p in root.glob('*.html') if p.name not in {'shadow-test.html','terminal.html','market-embed.html'}]
          pages.extend((root / 'articles').glob('*.html'))
          for page in pages:
              before = page.read_text(encoding='utf-8')
              after = with_site_chrome(before)
              assert with_site_chrome(after) == after, page
              if after != before:
                  page.write_text(after, encoding='utf-8')
          print(f'Applied publication layout to {len(pages)} public pages.')
          PY
          git diff --check
          git config user.name 'Standalone News Website'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.html'
          if ! git diff --cached --quiet; then
            git commit -m 'Make legal footers and keyboard navigation available across the public site'
            git push origin HEAD:refs/heads/updates/terminal-legal-accessibility
          fi
          git rev-parse HEAD
      - name: Validate existing site tests and CNN publication dates
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 - <<'PY'
          import datetime, json, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          import update_news
          feed = next(x for x in update_news.SOURCES if x['id']=='terminal_cnn')
          rows = update_news.fetch(feed, datetime.datetime.now(datetime.timezone.utc))
          assert rows and all(x['url'].startswith('https://www.cnn.com/') and x['source_type']=='Publisher sitemap' and x['summary']=='' for x in rows)
          print('CNN ORIGINAL HEADLINES', len(rows))
          PY
          node --input-type=module - <<'JS'
          import assert from 'node:assert/strict';
          import { parseFeed } from './functions/api/wire.js';
          const sitemap = '<urlset xmlns:news="http://www.google.com/schemas/sitemap-news/0.9"><url><loc>https://www.cnn.com/story</loc><lastmod>2026-11-17T00:20:00.000Z</lastmod><news:news><news:publication_date>2026-11-16T21:30:00.000Z</news:publication_date><news:title>Headline &amp; test</news:title></news:news></url><url><loc>https://external.example/story</loc><news:news><news:publication_date>2026-11-16T21:30:00Z</news:publication_date><news:title>Untrusted host</news:title></news:news></url><url><loc>https://www.cnn.com/undated</loc><lastmod>2026-11-17T00:20:00.000Z</lastmod><news:title>Missing publication time</news:title></url></urlset>';
          const source = { name:'CNN', topic:'US News', url:'https://www.cnn.com/sitemap/news.xml', format:'news-sitemap' };
          const rows = parseFeed(sitemap, source, Date.parse('2026-11-17T02:00:00Z'));
          assert.equal(rows.length, 1);
          assert.equal(rows[0].published_at,'2026-11-16T21:30:00.000Z');
          assert.equal(rows[0].title,'Headline & test');
          assert.equal(rows[0].source_type,'Publisher sitemap');
          console.log('Verified CNN publication-date and same-publisher link checks.');
          JS
      - name: Scan every public page for WCAG violations and responsive overflow
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/standalone-audit.log 2>&1 &
          export SITE_ROOT="$PWD"
          npm install --prefix "$RUNNER_TEMP/a11y" --no-audit --no-fund axe-core@4.10.3 playwright-core@1.55.0
          cd "$RUNNER_TEMP/a11y"
          export CHROME_BIN="$(command -v google-chrome || command -v chromium)"
          node --input-type=commonjs - <<'JS'
          const {chromium}=require('playwright-core');
          const fs=require('node:fs');
          const path=require('node:path');
          const assert=require('node:assert/strict');
          const base='http://127.0.0.1:8080';
          const root=process.env.SITE_ROOT;
          const pages=['/',...fs.readdirSync(root).filter(x=>x.endsWith('.html')&&!['index.html','shadow-test.html','terminal.html'].includes(x)).map(x=>'/'+x),'/articles/',...fs.readdirSync(path.join(root,'articles')).filter(x=>x.endsWith('.html')&&x!=='index.html').map(x=>'/articles/'+x)];
          const groups=new Map();
          function add(route,name,val) {
            if (!groups.has(name)) groups.set(name,[]);
            groups.get(name).push([route,val]);
          }
          (async()=>{
            const browser=await chromium.launch({executablePath:process.env.CHROME_BIN,args:['--no-sandbox']});
            try {
              const context=await browser.newContext({viewport:{width:1280,height:900},reducedMotion:'reduce'});
              await context.route('**/*',r=>r.request().url().startsWith(base+'/')?r.continue():r.abort());
              let next=0;
              await Promise.all(Array.from({length:4},async()=>{
                const page=await context.newPage();
                while(next<pages.length){
                  const route=pages[next++];
                  try{
                    const response=await page.goto(base+route,{waitUntil:'load',timeout:18000});
                    assert.ok(response.ok());
                    await page.addScriptTag({path:require.resolve('axe-core')});
                    const data=await page.evaluate(async()=>{
                      const rules=await axe.run({runOnly:{type:'tag',values:['wcag2a','wcag2aa','wcag21a','wcag21aa','wcag22aa']},iframes:false});
                      return {issues:rules.violations.map(v=>({id:v.id,items:v.nodes.map(n=>[n.target.join('/'),n.failureSummary?.slice(0,300)])})),
                          title:document.title,heading:!!document.querySelector('h1'),skip:!!document.querySelector('a.skip-link, a.skip, a.site-skip-link'),
                          footer:['terms','privacy','newsletter-privacy','accessibility','contact'].every(file=>!!document.querySelector('footer a[href$="/'+file+'.html"]')),main:!!document.querySelector('main,[role=main]')};
                    });
                    for(const {id,items} of data.issues) add(route,id,items);
                    for(const key of ['title','heading','skip','footer','main']) if(!data[key] && !(route==='/market-embed.html' && ['skip','footer'].includes(key))) add(route,'missing '+key,[]);
                    if(!route.startsWith('/articles/')||route==='/articles/'||route===pages.at(-1)){
                      await page.setViewportSize({width:320,height:760});
                      const overflow=await page.evaluate(()=>({excess:document.documentElement.scrollWidth-innerWidth, elements:[...document.querySelectorAll('body *')].filter(e=>e.getBoundingClientRect().right>innerWidth+3&&e.clientWidth>25).slice(0,8).map(e=>[e.tagName,e.id,e.className?.baseVal||e.className])}));
                      if (overflow.excess>2) add(route,'mobile overflow',overflow);
                      await page.setViewportSize({width:1280,height:900});
                    }
                  }catch(e){add(route,'scan failed',String(e).slice(0,350));}
                }
                await page.close();
              }));
              console.log('AUDITED',pages.length);
              for(const [rule,affected] of groups) {
                const ordinary=affected.filter(([route])=>!route.startsWith('/articles/')||route==='/articles/');
                const articles=affected.filter(([route])=>route.startsWith('/articles/')&&route!=='/articles/');
                const rows=[...ordinary,...articles.slice(0,2)].map(([route,detail])=>[route,Array.isArray(detail)?detail.slice(0,9):detail]);
                console.log('AUDIT',JSON.stringify({rule,count:affected.length,rows}));
              }
              if(groups.size) process.exitCode=1;
            } finally { await browser.close(); }
          })().catch(e=>{console.error(e);process.exitCode=1;});
          JS
      - name: Check the real Markets panel and official X timeline
        if: always()
        run: |
          cd "$RUNNER_TEMP/a11y"
          export CHROME_BIN="$(command -v google-chrome || command -v chromium)"
          node --input-type=commonjs - <<'JS'
          const {chromium}=require('playwright-core');
          const assert=require('node:assert/strict');
          (async()=>{
            const browser=await chromium.launch({executablePath:process.env.CHROME_BIN,args:['--no-sandbox']});
            try {
              const page=await browser.newPage({viewport:{width:1360,height:900}});
              await page.goto('http://127.0.0.1:8080/',{waitUntil:'domcontentloaded'});
              await page.keyboard.press('Tab');
              assert.equal(await page.evaluate(()=>document.activeElement.textContent),'Skip to the terminal');
              await page.keyboard.press('Enter');
              assert.equal(await page.evaluate(()=>document.activeElement.id),'main');
              const chart=page.locator('#market-chart iframe');
              await chart.waitFor({state:'visible',timeout:20000});
              assert.ok(await chart.getAttribute('title'));
              const card = page.locator('.market-chart-card');
              assert.equal(await card.evaluate(e=>getComputedStyle(e).backgroundColor),'rgb(12, 17, 25)');
              assert.equal(await page.locator('#market-watchlist').getAttribute('open'),null);
              await page.locator('#market-symbol').selectOption('NASDAQ:NVDA');
              assert.match(await page.locator('#market-instrument').innerText(),/Nvidia/);
              assert.match(await page.locator('#market-chart-link').getAttribute('href'),/NASDAQ-NVDA/);
              await page.locator('#market-watchlist summary').focus();
              await page.keyboard.press('Enter');
              await page.locator('#market-quotes iframe').waitFor({timeout:20000});
              await page.getByRole('region',{name:'Market chart and watchlist'}).evaluate(el=>el.scrollTop=0);
              assert.equal(await page.locator('#x-account').inputValue(),'StandaloneNews');
              assert.equal(await page.locator('#x-profile-link').getAttribute('href'),'https://x.com/StandaloneNews');
              const x = page.locator('#x-timeline iframe');
              const status=page.locator('#x-status');
              await page.waitForFunction(()=>/Timeline for|unavailable here/.test(document.querySelector('#x-status').textContent),{},{timeout:30000});
              let contents='';
              let links=0;
              if(await x.count()){
                const frame=x.first().contentFrame();
                await frame.locator('body').waitFor({timeout:12000}).catch(()=>{});
                contents=await frame.locator('body').innerText({timeout:5000}).catch(()=> '');
                links=await frame.locator('a[href*="/status/"]').count();
              }
              console.log('X WIDGET',JSON.stringify({status:await status.innerText(),links,contents:contents.slice(0,350)}));
              await page.close();
              const mobile=await browser.newPage({viewport:{width:320,height:740},reducedMotion:'reduce'});
              for(const route of ['/','/standards.html','/markets.html','/articles/']){
                await mobile.goto('http://127.0.0.1:8080'+route,{waitUntil:'domcontentloaded'});
                await mobile.keyboard.press('Tab');
                const first=await mobile.evaluate(()=>document.activeElement.textContent);
                assert.match(first,/skip/i,route);
                await mobile.keyboard.press('Enter');
                assert.equal(await mobile.evaluate(()=>document.activeElement.tagName),'MAIN',route);
              }
              console.log('Keyboard skip links, symbol selection, dark chart and watchlist tested.');
            } finally {await browser.close();}
          })().catch(e=>{console.error(e);process.exitCode=1;});
          JS
