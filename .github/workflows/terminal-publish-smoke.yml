name: Verify external links open a separate tab across Standalone News

on:
  push:
    branches: [ops/terminal-publish-smoke]
    paths: [.github/workflows/terminal-publish-smoke.yml]

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: updates/outbound-link-tabs
      - name: Attach shared external-link behavior to existing pages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, 'scripts')
          from site_chrome import OUTBOUND_SCRIPT, with_site_chrome
          pages = [
              file for file in Path('.').glob('*.html')
              if file.name not in {'shadow-test.html','terminal.html','market-embed.html'}
          ]
          pages += list(Path('articles').glob('*.html'))
          for page in pages:
              before = page.read_text(encoding='utf-8')
              after = with_site_chrome(before)
              assert OUTBOUND_SCRIPT in after and after.count(OUTBOUND_SCRIPT) == 1, page
              assert with_site_chrome(after) == after, page
              if after != before:
                  page.write_text(after, encoding='utf-8')
          print(f'LINK SCRIPT ATTACHED ON {len(pages)} PAGES.')
          PY
          git diff --check
          git config user.name 'Standalone News Website'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.html'
          if ! git diff --cached --quiet; then
            git commit -m 'Apply external-link tabs to the public pages and archive'
            git push origin HEAD:refs/heads/updates/outbound-link-tabs
          fi
      - name: Check static accessibility and news templates
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Verify external clicks, keyboard activation and internal navigation
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/external-link-http.log 2>&1 &
          npm install --prefix "$RUNNER_TEMP/link-check" --no-audit --no-fund playwright-core@1.55.0
          cd "$RUNNER_TEMP/link-check"
          export CHROME_BIN="$(command -v google-chrome || command -v chromium)"
          export SITE_URL="http://127.0.0.1:8080/"
          node --input-type=commonjs - <<'JS'
          const {chromium}=require('playwright-core');
          const assert=require('node:assert/strict');
          const base=process.env.SITE_URL;
          (async()=>{
            const browser=await chromium.launch({executablePath:process.env.CHROME_BIN,args:['--no-sandbox']});
            try {
              const ctx=await browser.newContext({viewport:{width:1280,height:850}});
              await ctx.route('https://publisher.example/**',r=>r.fulfill({contentType:'text/html',body:'<title>Mock publisher</title><h1>Original reporting</h1>'}));
              const page=await ctx.newPage();
              const now=new Date(Date.now()-5000).toISOString();
              const sample={category:'US News',source:'Example Publisher',source_type:'Publisher RSS',published_at:now};
              await page.route('**/api/wire',r=>r.fulfill({json:{checked_at:now,feeds:[{source:sample.source,available:true}],items:[
                {...sample,title:'Sample original report',url:'https://publisher.example/one'},
                {...sample,title:'Sample keyboard report',url:'https://publisher.example/two'},
              ]}}));
              await page.route('**/data/news.json',r=>r.fulfill({json:{updated_at:now,items:[]}}));
              await page.goto(base,{waitUntil:'domcontentloaded'});
              const headline=page.getByRole('link',{name:'Sample original report',exact:true});
              await headline.waitFor();
              await page.waitForFunction(()=>[...document.querySelectorAll('#headlines a')].some(a=>a.target==='_blank'));
              assert.equal(await headline.getAttribute('target'),'_blank');
              assert.match(await headline.getAttribute('rel'),/\bnoopener\b/);
              assert.match(await headline.getAttribute('aria-describedby'),/\boutbound-new-tab-note\b/);
              assert.equal(await page.locator('#outbound-new-tab-note').textContent(),'Opens in a new tab.');
              let popup=await Promise.all([ctx.waitForEvent('page'),headline.click()]).then(r=>r[0]);
              await popup.waitForURL('https://publisher.example/one');
              assert.equal(await popup.evaluate(()=>window.opener),null);
              assert.equal(page.url(),base);
              await popup.close();

              await page.getByRole('link',{name:'Sample keyboard report',exact:true}).focus();
              popup=await Promise.all([ctx.waitForEvent('page'),page.keyboard.press('Enter')]).then(r=>r[0]);
              await popup.waitForURL('https://publisher.example/two');
              assert.equal(page.url(),base);
              await popup.close();
              console.log('EXTERNAL NEWS VERIFIED by click and keyboard');

              const x=page.locator('#x-profile-link');
              assert.equal(await x.getAttribute('target'),'_blank');
              const market=page.locator('#market-chart-link');
              assert.equal(await market.getAttribute('target'),'_blank');
              await page.evaluate(()=>{
                const anchor=document.createElement('a');
                anchor.id='dynamic-link-fixture';
                anchor.href='https://publisher.example/other';
                anchor.rel='license';
                anchor.title='Existing title';
                anchor.setAttribute('aria-describedby','market-top-heading');
                document.body.append(anchor);
              });
              const dynamic=page.locator('#dynamic-link-fixture');
              await page.waitForFunction(()=>document.getElementById('dynamic-link-fixture').target==='_blank');
              assert.equal(await dynamic.getAttribute('title'),'Existing title');
              assert.match(await dynamic.getAttribute('rel'),/\blicense\b/);
              assert.match(await dynamic.getAttribute('aria-describedby'),/\bmarket-top-heading\b.*\boutbound-new-tab-note\b/);
              for(const href of ['#markets','mailto:contact@standalonenews.com','https://www.standalonenews.com/edition.html']){
                await dynamic.evaluate((a,value)=>a.href=value,href);
                await page.waitForFunction(()=>!document.getElementById('dynamic-link-fixture').hasAttribute('target'));
                assert.equal(await dynamic.getAttribute('rel'),'license');
                assert.equal(await dynamic.getAttribute('aria-describedby'),'market-top-heading');
              }
              await dynamic.evaluate(a=>{a.href='https://publisher.example/file';a.download='report.html';});
              assert.equal(await dynamic.getAttribute('target'),null);
              console.log('DYNAMIC, INTERNAL, ANCHOR, MAIL AND DOWNLOAD BEHAVIOR VERIFIED');

              const terms=page.locator('footer').getByRole('link',{name:'Terms of use',exact:true});
              assert.notEqual(await terms.getAttribute('target'),'_blank');
              await Promise.all([page.waitForURL(/\/terms(?:\.html)?(?:$|[?#])/),terms.click()]);
              assert.equal(ctx.pages().length,1);
              const privacy=page.locator('footer a[href$="privacy.html"]').filter({hasText:/^Privacy(?: policy)?$/}).first();
              await privacy.waitFor();
              assert.notEqual(await privacy.getAttribute('target'),'_blank');
              console.log('SAME-TAB NAVIGATION VERIFIED');

              for(const name of ['edition.html','markets.html','research.html','sports.html','articles/','privacy.html']){
                await page.goto(new URL(name,base).href,{waitUntil:'domcontentloaded'});
                await page.locator('#outbound-new-tab-note').waitFor({state:'attached'});
                const links=await page.evaluate(()=>[...document.querySelectorAll('a[href]')]
                  .filter(a=>/^https?:/.test(a.href)&&new URL(a.href).origin!==location.origin&&!/^(www\.)?standalonenews\.com$/.test(new URL(a.href).hostname)&&!a.hasAttribute('download'))
                  .map(a=>({target:a.target,rel:a.rel})));
                assert.ok(links.every(a=>a.target==='_blank'&&/\bnoopener\b/.test(a.rel)),name);
                console.log('REST OF SITE VERIFIED',name,links.length);
              }
            }finally{await browser.close();}
          })().catch(e=>{console.error(e);process.exitCode=1;});
          JS
