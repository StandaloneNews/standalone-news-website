name: Verify the live market bar and headline coverage

on:
  push:
    branches: [ops/terminal-publish-smoke]
    paths: [.github/workflows/terminal-publish-smoke.yml]

permissions: {}

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for the public terminal and publisher feeds
        run: |
          python3 - <<'PY'
          import json
          import time
          import urllib.request
          endpoint = 'https://standalonenews.com'
          def download(path):
              req = urllib.request.Request(endpoint+path, headers={'User-Agent':'Mozilla/5.0', 'Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=14) as response:
                  return response.read()
          for attempt in range(20):
              try:
                  home = download('/').decode()
                  feeds = json.loads(download('/api/wire'))
                  snapshot = json.loads(download('/data/news.json'))
                  configured = {feed['source'] for feed in feeds['feeds']}
                  responding = {feed['source'] for feed in feeds['feeds'] if feed['available']}
                  new_names = {'MarketWatch', 'European Central Bank', 'CBS News', 'The Verge', 'NASA'}
                  serving = {item['source'] for item in feeds['items']}
                  snapshot_sources = {item['source'] for item in snapshot['items']}
                  archive_new = {'Axios', 'CoinDesk', 'ProPublica', 'ScienceDaily', 'The Guardian Sport'}
                  print('LIVE', json.dumps({'attempt':attempt+1, 'bar':'market-top-heading' in home, 'direct_configured':len(configured), 'responding':len(responding), 'items':len(feeds['items']), 'direct_selected':sorted(serving&new_names), 'snapshot_count':len(snapshot_sources), 'snapshot_selected':sorted(snapshot_sources&archive_new), 'snapshot_updated_at':snapshot.get('updated_at')}), flush=True)
                  if 'market-top-heading' in home and new_names <= configured and len(serving&new_names)>=3 and len(snapshot_sources&archive_new)>=3:
                      break
              except Exception as exc:
                  print('Live site attempt', attempt+1, str(exc),flush=True)
              time.sleep(12)
          else:
              raise SystemExit('The live site did not serve the expanded bar and headline feeds in the verification window.')
          PY
      - name: Verify the live market widget on desktop and mobile
        run: |
          npm install --prefix "$RUNNER_TEMP/live-market-check" --no-audit --no-fund playwright-core@1.55.0
          cd "$RUNNER_TEMP/live-market-check"
          export CHROME_BIN="$(command -v google-chrome || command -v chromium)"
          node --input-type=commonjs - <<'JS'
          const { chromium } = require('playwright-core');
          const assert = require('node:assert/strict');
          (async() => {
            const browser = await chromium.launch({executablePath:process.env.CHROME_BIN,args:['--no-sandbox']});
            try {
              for (const width of [1440, 390]) {
                const page = await browser.newPage({viewport:{width,height:850}});
                await page.goto('https://standalonenews.com/',{waitUntil:'domcontentloaded'});
                const frame = page.locator('#market-top-quotes iframe');
                await frame.waitFor({state:'visible',timeout:20000});
                assert.ok(await frame.getAttribute('title'));
                await page.frameLocator('#market-top-quotes iframe').getByText('SPY',{exact:true}).first().waitFor({state:'visible',timeout:12000});
                const layout = await page.evaluate(()=>({
                  height: document.querySelector('.market-top').getBoundingClientRect().bottom,
                  body: document.querySelector('#workspace').getBoundingClientRect().top,
                  viewport: innerWidth, width: document.documentElement.scrollWidth,
                }));
                assert.ok(layout.height <= layout.body && layout.width <= layout.viewport+1, JSON.stringify(layout));
                console.log(width, 'live market bar loaded quotes above the terminal without page overflow.');
                await page.close();
              }
            } finally { await browser.close(); }
          })().catch(error=>{console.error(error);process.exitCode=1});
          JS
