name: Verify homepage headline pagination before publishing

on:
  push:
    branches: [ops/terminal-publish-smoke]
    paths: [.github/workflows/terminal-publish-smoke.yml]

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 323d302131c75b3b7032564a19e0a1f4c4714222
      - name: Check site tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Test the four page sizes and navigation with more than 1600 articles
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 >/tmp/standalone-pager-http.log 2>&1 &
          npm install --prefix "$RUNNER_TEMP/pager-check" --no-audit --no-fund playwright-core@1.55.0 axe-core@4.10.3
          export NODE_PATH="$RUNNER_TEMP/pager-check/node_modules"
          export CHROME_BIN="$(command -v google-chrome || command -v chromium)"
          export PAGER_SITE_URL="http://127.0.0.1:8080/"
          node --input-type=commonjs - <<'JS'
          const { chromium } = require('playwright-core');
          const assert = require('node:assert/strict');
          const base = process.env.PAGER_SITE_URL;
          (async()=>{
            const browser = await chromium.launch({executablePath:process.env.CHROME_BIN,args:['--no-sandbox']});
            try {
              for (const width of [1440, 320]) {
                const page = await browser.newPage({viewport:{width,height:850}});
                const rows = Array.from({length:1603},(_,i)=>({
                  title:'Pagination article '+String(i).padStart(4,'0'),
                  url:'https://example.org/news/'+i,
                  published_at:new Date(Date.now()-60_000-i*1000).toISOString(),
                  source:i%2===0?'Reuters':'AP News',
                  category:'World',source_type:'Publisher RSS',
                }));
                await page.route('**/api/wire',r=>r.fulfill({json:{checked_at:rows[0].published_at,feeds:[{source:'Reuters',available:true}],items:rows.slice(0,850)}}));
                await page.route('**/data/news.json',r=>r.fulfill({json:{updated_at:rows[0].published_at,items:rows.slice(800)}}));
                await page.goto(base,{waitUntil:'domcontentloaded'});
                await page.locator('#headlines li').first().waitFor();
                const size = page.getByLabel('Headlines per page');
                const results = page.locator('#headlines li');
                const range = page.locator('#result-count');
                const pager = page.getByRole('navigation',{name:'Headline pages'});
                const prev = pager.getByRole('button',{name:'Previous'});
                const next = pager.getByRole('button',{name:'Next'});
                const start = () => page.locator('#headlines a').first().innerText();
          
                assert.deepEqual(await size.locator('option').evaluateAll(a=>a.map(x=>x.value)),['10','25','50','100']);
                assert.equal(await size.inputValue(),'25');
                assert.equal(await results.count(),25);
                assert.equal(await range.innerText(),'Showing 1–25 of 1,603 headlines');
                assert.ok(await prev.isDisabled());
                await next.focus();
                await page.keyboard.press('Enter');
                assert.equal(await start(),'Pagination article 0025');
                assert.equal(await range.innerText(),'Showing 26–50 of 1,603 headlines');
                assert.equal(await page.evaluate(()=>document.activeElement.textContent),'Pagination article 0025');
                assert.equal(await page.locator('#headlines a').first().getAttribute('target'),'_blank');
                await prev.click();
                assert.equal(await start(),'Pagination article 0000');
          
                for(const amount of [10,50,100]){
                  await size.selectOption(String(amount));
                  assert.equal(await results.count(),amount);
                  assert.equal(await start(),'Pagination article 0000');
                  assert.ok(await page.evaluate(()=>document.documentElement.scrollWidth<=innerWidth+1),width+'px');
                }
                if(width===1440){
                  for(let step=1;step<17;step++) await next.click();
                  assert.equal(await pager.locator('#headline-page-number').innerText(),'Page 17 of 17');
                  assert.equal(await range.innerText(),'Showing 1,601–1,603 of 1,603 headlines');
                  assert.equal(await results.count(),3);
                  assert.ok(await next.isDisabled());
                  assert.equal(await page.locator('#headlines a').last().innerText(),'Pagination article 1602');
                }else{
                  await next.click();
                  assert.equal(await start(),'Pagination article 0100');
                }
          
                const search=page.getByRole('searchbox',{name:'Search headlines'});
                await search.fill('article 1602');
                assert.equal(await range.innerText(),'Showing 1–1 of 1 headline');
                assert.equal(await results.count(),1);
                assert.equal(await start(),'Pagination article 1602');
                assert.ok(await pager.isHidden());
                await search.fill('nonexistent keyword');
                assert.equal(await range.innerText(),'No headlines match these filters.');
                assert.ok(await pager.isHidden());
                await search.clear();
                await next.click();
                await page.locator('#filter-panel > summary').click();
                await page.getByLabel('Source',{exact:true}).selectOption('AP News');
                assert.equal(await range.innerText(),'Showing 1–100 of 801 headlines');
                assert.equal(await start(),'Pagination article 0001');
                await page.getByRole('button',{name:'Clear filters'}).click();
                assert.equal(await start(),'Pagination article 0000');
          
                await size.selectOption('50');
                await page.reload({waitUntil:'domcontentloaded'});
                await page.locator('#headlines li').first().waitFor();
                assert.equal(await size.inputValue(),'50');
                assert.equal(await results.count(),50);
                assert.equal(await start(),'Pagination article 0000');
                await page.addScriptTag({path:require.resolve('axe-core')});
                const violations=await page.evaluate(async()=>(
                  await axe.run('.feed-list',{runOnly:{type:'tag',values:['wcag2a','wcag2aa','wcag21a','wcag21aa','wcag22aa']},iframes:false})
                ).violations.map(x=>[x.id,x.nodes.map(n=>n.target)]));
                assert.deepEqual(violations,[]);
                console.log('PAGINATION VERIFIED',width,'four sizes, full-feed search, keyboard, saved preference');
                await page.close();
              }
            }finally{await browser.close();}
          })().catch(error=>{console.error(error);process.exitCode=1;});
          JS
