name: Standalone News desk feed

on:
  schedule:
    # Staggered 15 minutes away from the existing :00/:30 RSS refresh.
    - cron: '15,45 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: standalone-desk-feed-write
  cancel-in-progress: false

jobs:
  build-desk:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect and rank public news with licensed photo matching
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python scripts/publish_desk.py
      - name: Commit desk feed only
        shell: bash
        run: |
          git config user.name "Standalone News Desk Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/desk.json
          if git diff --cached --quiet; then
            echo "No desk feed changes"
            exit 0
          fi
          git commit -m "Refresh source-ranked news desk"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "Push retry $attempt"
            sleep 5
          done
          echo "Could not push desk feed after retries"
          exit 1
