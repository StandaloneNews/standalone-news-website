name: Reading edition and sitewide accessibility audit
on:
  push:
    branches: [edition/reader-first-accessibility, main]
    paths:
      - edition.html
      - edition-reading.css
      - home-terminal.css
      - site-accessibility.css
      - accessibility.html
      - broadsheet.css
      - tests/edition-reader.test.cjs
      - tests/sitewide-accessibility.test.cjs
      - .github/workflows/edition-accessibility.yml
  schedule:
    - cron: '0 11 * * 1' # Weekly Monday, UTC; avoids costs on every automated news update.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reading:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Static regressions
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Install browser checks
        run: |
          npm install --prefix "$RUNNER_TEMP/edition" --no-audit --no-fund playwright-core@1.55.0 axe-core@4.10.3
      - name: Start local preview and test Reading Edition
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/edition-preview.log 2>&1 &
          export NODE_PATH="$RUNNER_TEMP/edition/node_modules"
          export CHROME_BIN="$(command -v google-chrome || command -v chromium)"
          node tests/edition-reader.test.cjs
      - name: Sitewide automated WCAG accessibility audit
        if: always()
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/edition-preview2.log 2>&1 &
          export NODE_PATH="$RUNNER_TEMP/edition/node_modules"
          export CHROME_BIN="$(command -v google-chrome || command -v chromium)"
          node tests/sitewide-accessibility.test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sitewide-accessibility-report
          path: accessibility-audit-results.json
          if-no-files-found: ignore
