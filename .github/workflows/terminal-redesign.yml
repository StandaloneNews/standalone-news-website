name: Terminal redesign accessibility and interaction tests
on:
  push:
    branches: [main, feature/free-news-terminal-redesign, feature/rounded-terminal-split-trackers, fix/full-width-terminal-dark-calendar]
    paths:
      - "index.html"
      - "terminal.js"
      - "terminal-redesign.css"
      - "terminal-story.js"
      - "wire-feed.js"
      - "terminal-polish.css"
      - "economic-calendar-status.js"
      - "market-polish.css"
      - "markets.html"
      - "us-debt.html"
      - "bitcoin-halving.html"
      - "desk-tools.css"
      - "economic-calendar.html"
      - "live-releases.html"
      - "trackers.html"
      - "trackers.js"
      - "tests/terminal-redesign.test.cjs"
      - ".github/workflows/terminal-redesign.yml"
permissions:
  contents: read
jobs:
  terminal:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax and static accessibility suite
        run: |
          node --check terminal-story.js
          node --check trackers.js
          node --check terminal.js
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Run browser interaction and WCAG smoke tests
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/terminal-server.log 2>&1 &
          npm install --prefix "$RUNNER_TEMP/terminal-smoke" --no-audit --no-fund playwright-core@1.55.0 axe-core@4.10.3
          export NODE_PATH="$RUNNER_TEMP/terminal-smoke/node_modules"
          export CHROME_BIN="$(command -v google-chrome || command -v chromium)"
          node tests/terminal-redesign.test.cjs
