name: Verify published Standalone signature design
on:
  push:
    branches: [ops/verify-signature-live]
    paths: [.github/workflows/verify-signature-live.yml]
permissions: {}
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Confirm public site serves signature files
        run: |
          python3 - <<'PY'
          from urllib.request import Request,urlopen
          from time import sleep
          def get(path):
            with urlopen(Request('https://standalonenews.com'+path,headers={'User-Agent':'Mozilla/5.0','Cache-Control':'no-cache'}),timeout=17) as r:
              return r.read().decode(errors='replace')
          for attempt in range(32):
            try:
              home=get('/')
              calendar=get('/economic-calendar.html')
              css=get('/signature-ui.css?v=1')
              broader=get('/broadsheet.css?v=terminal-dark')
              if 'Stay curious.' in home and 'signature-ui.css?v=1' in home and 'signature-desk.css?v=1' in calendar and 'Shared signature visuals also apply' in broader and '.signature-hero' in css:
                for path in ['/markets.html','/sports.html','/research.html','/discuss.html','/edition.html','/us-debt.html','/bitcoin-halving.html']:
                  assert 'signature-' in get(path),path
                print('Live signature HTML, CSS and all major desks confirmed',flush=True)
                break
            except Exception as e:
              print('Verifying deployment:',repr(e),flush=True)
            sleep(10)
          else:
            raise SystemExit('Current redesigned website is not visible')
          PY
      - name: Check live browser layouts, news feed and sharing
        run: |
          npm install --prefix "$RUNNER_TEMP/siglive" --no-audit --no-fund playwright-core@1.55.0 axe-core@4.10.3
          export NODE_PATH="$RUNNER_TEMP/siglive/node_modules"
          export CHROME_BIN="$(command -v google-chrome || command -v chromium)"
          node --input-type=commonjs - <<'JS'
          const {chromium}=require('playwright-core');
          const assert=require('node:assert/strict');
          (async()=>{
            const browser=await chromium.launch({executablePath:process.env.CHROME_BIN,args:['--no-sandbox']});
            try {
              for(const width of [390,1600]){
                const page=await browser.newPage({viewport:{width,height:900},reducedMotion:'reduce'});
                await page.goto('https://standalonenews.com/',{waitUntil:'domcontentloaded'});
                const hero=page.locator('.signature-hero');
                assert.equal(await hero.evaluate(e=>getComputedStyle(e).backgroundColor),'rgb(255, 197, 0)');
                assert.equal(await page.locator('.top').evaluate(e=>getComputedStyle(e).position),'sticky');
                assert.equal(await page.evaluate(()=>document.documentElement.scrollWidth<=innerWidth+1),true);
                await page.locator('#headlines .row-title').first().waitFor({timeout:45000});
                const headlineCount=await page.locator('#result-count').innerText();
                assert.ok(headlineCount.includes('headlines'));
                const share=page.locator('.row-share').first();
                await share.click();
                assert.ok(await page.getByRole('dialog').isVisible());
                assert.ok(await page.getByRole('button',{name:'Copy headline'}).isVisible());
                await page.getByRole('button',{name:'Share via…'}).click();
                assert.ok(await page.getByRole('link',{name:'X',exact:true}).isVisible());
                console.log('LIVE DESIGN',width,headlineCount);
                await page.close();
              }
              const cal=await browser.newPage({viewport:{width:390,height:900},reducedMotion:'reduce'});
              await cal.goto('https://standalonenews.com/economic-calendar.html',{waitUntil:'domcontentloaded'});
              assert.equal(await cal.locator('.desk-page-heading').evaluate(e=>getComputedStyle(e).backgroundColor),'rgb(255, 197, 0)');
              assert.equal(await cal.evaluate(()=>document.documentElement.scrollWidth<=innerWidth+1),true);
              console.log('LIVE CALENDAR SIGNATURE PASSED');
              await cal.close();
            }finally{await browser.close()}
          })().catch(err=>{console.error(err);process.exitCode=1});
          JS
