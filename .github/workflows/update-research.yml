name: Refresh SEC company research
on:
  schedule:
    - cron: '8 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: standalone-news-main-writes
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out website
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate SEC filing parser
        run: python scripts/update_research.py --self-test

      - name: Refresh official SEC directory and selected company filings
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python scripts/update_research.py

      - name: Commit research data
        run: |
          git config user.name 'Standalone News Research Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/research-companies.json data/research-snapshots.json
          if git diff --cached --quiet; then
            echo 'No research changes'
            exit 0
          fi
          git commit -m 'Refresh official SEC research snapshots'
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "SEC data push retry $attempt"
            sleep 7
          done
          exit 1
