name: Update public news feed
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out website
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh public RSS headlines
        run: python scripts/update_news.py
      - name: Commit public headline data only
        run: |
          git config user.name "Standalone News Feed Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json feed.xml
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Standalone News headlines"
            git push --rebase origin main
            git push origin HEAD:main
          fi
