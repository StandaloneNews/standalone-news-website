name: Update news and publish official-source explainers
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: standalone-news-feed-publisher
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out website
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh public RSS headlines
        run: python scripts/update_news.py
      - name: Publish strictly sourced AI explainers (if enabled)
        env:
          AUTO_PUBLISH_ENABLED: ${{ vars.AUTO_PUBLISH_ENABLED || 'false' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash-lite
        run: python scripts/auto_publish.py
      - name: Commit public news and article files
        run: |
          git config user.name "Standalone News Feed Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json data/articles.json feed.xml sitemap.xml articles/ 
          if ! git diff --cached --quiet; then
            git commit -m "Refresh headlines and sourced articles"
            git push
          fi
